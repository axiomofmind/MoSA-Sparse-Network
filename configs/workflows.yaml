schema: sparse-network-workflow-config.v1
maximum_stages: 3
frozen_triggers:
  - route_ambiguity
  - deterministic_failure
  - missing_evidence
  - model_disagreement
  - repeated_failure
  - high_risk
  - maximum_quality
  - disputed
coordination:
  context_character_limit: 1600
  continue_after_verified:
    - route_ambiguity
    - missing_evidence
    - model_disagreement
    - repeated_failure
    - high_risk
    - maximum_quality
    - disputed
  accept_after_clean_critique:
    - maximum_quality
